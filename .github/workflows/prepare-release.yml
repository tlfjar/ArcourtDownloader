name: Prepare release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'NEW version tag (for example v0.1.3). Creates a draft, never publishes.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prepare-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
jobs:
  prepare:
    name: Create new tag and start draft build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare new release from protected main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/prepare-release.ps1 -Tag $env:RELEASE_TAG
